[package]
name = "pipedeck-engine"
description = "PipeWire graph management for Pipedeck (no UI dependencies)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pipewire = { version = "0.10.1", features = ["v1_2_0"] }
libspa = "0.10.1"
serde = { version = "1", features = ["derive"] }
toml = "1"
log.workspace = true
thiserror.workspace = true
vst3 = "0.3"
libloading = "0.9"
libc = "0.2.189"
nnnoiseless = "0.5.2"
serde_json = "1"
# The soundboard: its files decoded, and handed to the audio thread.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm"] }
rtrb = "0.3"
# Opus, which Discord's soundboards are often in, from the system's libopus.
symphonia-adapter-libopus = { version = "0.2.9", default-features = false }

[dev-dependencies]
env_logger = "0.11"
