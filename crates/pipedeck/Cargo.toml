[package]
name = "pipedeck"
description = "PipeWire audio mixer for streamers, GTK4 + libadwaita UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

build = "build.rs"

[[bin]]
name = "pipedeck"
path = "src/main.rs"

[dependencies]
pipedeck-engine = { path = "../pipedeck-engine" }
gtk4 = { version = "0.11.4", features = ["v4_18"] }
libadwaita = { version = "0.9.2", features = ["v1_7"] }
async-channel = "2"
libc = "0.2"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "1"
log.workspace = true
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[build-dependencies]
glib-build-tools = "0.22"
