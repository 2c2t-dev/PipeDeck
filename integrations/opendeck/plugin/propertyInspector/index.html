<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Pipedeck</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: sans-serif;
				font-size: 13px;
			}
			body {
				margin: 0;
				padding: 8px;
			}
			.row {
				display: grid;
				grid-template-columns: 8em 1fr;
				align-items: center;
				gap: 8px;
				margin-bottom: 8px;
			}
			.row > :last-child {
				width: 100%;
				box-sizing: border-box;
			}
			.pair {
				display: grid;
				grid-template-columns: 1fr 4.5em;
				gap: 8px;
				align-items: center;
			}
			.note {
				opacity: 0.7;
				margin: -2px 0 10px 8em;
				padding-left: 8px;
			}
			[hidden] {
				display: none !important;
			}
		</style>
	</head>
	<body>
		<p id="offline" class="note" hidden>Start Pipedeck to see its channels and mixes.</p>

		<div id="channel-rows" hidden>
			<label class="row">Channel <select id="channel"></select></label>
			<label class="row" id="in-row">Level <select id="in"></select></label>
		</div>

		<div id="mix-rows" hidden>
			<label class="row">Mix <select id="mix"></select></label>
		</div>

		<div id="voice-rows" hidden>
			<label class="row">Person <select id="slot"></select></label>
		</div>

		<div id="effect-rows" hidden>
			<label class="row">Channel <select id="effect-channel"></select></label>
			<label class="row">Effect <select id="effect"></select></label>
		</div>

		<div id="app-rows" hidden>
			<label class="row">Application <select id="app"></select></label>
			<label class="row">Channel <select id="app-channel"></select></label>
			<p class="note">A press puts it on the channel, or takes it off again.</p>
		</div>

		<div id="level-rows" hidden>
			<label class="row">
				Display
				<select id="display">
					<option value="meter">Level meter</option>
					<option value="volume">Volume only</option>
				</select>
			</label>
			<label class="row" id="mode-row">
				Key press
				<select id="mode">
					<option value="mute">Mute</option>
					<option value="set">Set volume</option>
					<option value="adjust">Adjust volume</option>
				</select>
			</label>
			<div class="row" id="volume-row">
				Volume
				<div class="pair"><input id="volume" type="range" min="0" max="100" step="1" /><span id="volume-shown"></span></div>
			</div>
			<label class="row" id="fade-row">
				Fade
				<select id="fade">
					<option value="0">None</option>
					<option value="500">0.5 s</option>
					<option value="1000">1 s</option>
					<option value="2000">2 s</option>
					<option value="5000">5 s</option>
				</select>
			</label>
			<label class="row" id="step-row">Step (%) <input id="step" type="number" min="-100" max="100" step="1" /></label>
			<p class="note" id="step-note"></p>
		</div>

		<div id="switch-rows" hidden>
			<label class="row">
				Mode
				<select id="switch">
					<option value="select">Select one</option>
					<option value="toggle">Toggle between two</option>
				</select>
			</label>
			<label class="row"><span id="first-label">First</span> <select id="first"></select></label>
			<label class="row" id="second-row"><span id="second-label">Second</span> <select id="second"></select></label>
		</div>

		<script>
			// One page for every action. What there is to pick from comes from
			// the plugin, which asks Pipedeck; the choice is kept by id.
			let socket;
			let context;
			let actionUuid;
			let action;
			let dial;
			let settings = {};
			let mixer = null;

			const $ = (id) => document.getElementById(id);

			function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
				actionInfo = JSON.parse(actionInfo);
				context = actionInfo.context ?? uuid;
				actionUuid = actionInfo.action;
				action = actionUuid.split(".").pop();
				dial = actionInfo.payload.controller === "Encoder";
				settings = actionInfo.payload.settings || {};

				socket = new WebSocket("ws://localhost:" + port);
				socket.onopen = () => {
					socket.send(JSON.stringify({ event: registerEvent, uuid }));
					socket.send(JSON.stringify({ event: "sendToPlugin", action: actionUuid, context, payload: { request: "mixer" } }));
				};
				socket.onmessage = (message) => {
					const data = JSON.parse(message.data);
					if (data.event === "sendToPropertyInspector" && "mixer" in data.payload) {
						mixer = data.payload.mixer;
						show();
					} else if (data.event === "didReceiveSettings") {
						settings = data.payload.settings || {};
						show();
					}
				};
				show();
			}

			function save() {
				socket.send(JSON.stringify({ event: "setSettings", context, payload: settings }));
			}

			// A select's options; the chosen value is kept even while it is not
			// in the mixer, so opening the page loses nothing.
			function fill(select, options, chosen, missing) {
				select.replaceChildren();
				if (chosen === undefined || chosen === null) select.add(new Option("Pick one", ""));
				for (const [value, label] of options) select.add(new Option(label, value));
				if (chosen !== undefined && chosen !== null && !options.some(([value]) => value === String(chosen))) {
					select.add(new Option(missing || "(gone)", String(chosen)));
				}
				select.value = chosen === undefined || chosen === null ? "" : String(chosen);
			}

			function show() {
				$("offline").hidden = mixer !== null;
				const view = {
					channels: mixer?.channels ?? [],
					mixes: mixer?.mixes ?? [],
					outputs: mixer?.outputs ?? [],
				};
				const level = action === "channel" || action === "mix" || action === "voice";

				$("channel-rows").hidden = action !== "channel";
				$("mix-rows").hidden = action !== "mix";
				$("level-rows").hidden = !level;
				$("switch-rows").hidden = action !== "monitor" && action !== "output";
				$("voice-rows").hidden = action !== "voice";
				$("effect-rows").hidden = action !== "effect";
				$("app-rows").hidden = action !== "app";
				panels[action]?.(view);
				if (level) showLevel();
			}

			// What each action's page shows, by action.
			const panels = {
				effect: showEffect,
				app: showApp,
				voice: showVoice,
				channel: showChannel,
				mix: ({ mixes }) => fill($("mix"), mixes.map((mix) => [String(mix.id), mix.name]), settings.mix, settings.label),
				monitor: showSwitch,
				output: showSwitch,
			};

			function showEffect({ channels }) {
				fill($("effect-channel"), channels.map((c) => [String(c.id), c.name]), settings.channel, settings.label);
				const channel = channels.find((c) => c.id === settings.channel);
				const effects = (channel?.effects ?? []).map((name, index) => [String(index), name]);
				const chosen = settings.effect !== undefined && channel ? channel.effects.indexOf(settings.effect) : -1;
				fill($("effect"), effects, chosen >= 0 ? chosen : settings.index, settings.effect);
			}

			function showApp({ channels }) {
				// What plays now, and what is on a channel already.
				const apps = new Map((mixer?.apps ?? []).map((a) => [a.key, a.name]));
				for (const c of channels) for (const key of c.apps ?? []) if (!apps.has(key)) apps.set(key, key);
				fill($("app"), [["@front", "The application in front"], ...[...apps].map(([key, name]) => [key, name])], settings.app, settings.label);
				fill($("app-channel"), channels.map((c) => [String(c.id), c.name]), settings.channel);
			}

			function showVoice() {
				// English ordinals: 1st, 2nd, 3rd, but 11th to 13th, and 21st again.
				const suffixes = { 1: "st", 2: "nd", 3: "rd" };
				const places = [];
				for (let n = 1; n <= 24; n++) {
					const suffix = n >= 11 && n <= 13 ? "th" : (suffixes[n % 10] ?? "th");
					places.push([String(n), `${n}${suffix} in the call`]);
				}
				fill($("slot"), places, settings.slot ?? 1);
			}

			function showChannel({ channels, mixes }) {
				const options = [];
				for (const channel of channels) {
					options.push([`c:${channel.id}`, channel.name]);
					for (const voice of channel.voices) options.push([`v:${channel.id}:${voice.user}`, `${channel.name} › ${voice.name}`]);
				}
				let chosen = null;
				if (settings.channel !== undefined && settings.user) chosen = `v:${settings.channel}:${settings.user}`;
				else if (settings.channel !== undefined) chosen = `c:${settings.channel}`;
				fill($("channel"), options, chosen, settings.label);
				// A person of a call has one level; a channel has its own and
				// one in each mix it feeds.
				$("in-row").hidden = !!settings.user || settings.channel === undefined;
				const fed = mixes.filter((mix) => (mixer?.cells ?? []).some(([c, m]) => c === settings.channel && m === mix.id));
				fill($("in"), [["", "Main level"], ...fed.map((mix) => [String(mix.id), `In ${mix.name}`])], settings.mix ?? "");
			}

			function showLevel() {
				const mode = settings.mode || "mute";
				$("display").value = settings.display === "volume" ? "volume" : "meter";
				$("mode-row").hidden = dial;
				$("mode").value = mode;
				$("volume-row").hidden = dial || mode !== "set";
				$("fade-row").hidden = dial || mode !== "set";
				$("volume").value = settings.volume ?? 100;
				$("volume-shown").textContent = `${$("volume").value}%`;
				$("fade").value = String(settings.fade ?? 0);
				const stepped = dial || mode === "adjust";
				$("step-row").hidden = !stepped;
				$("step-note").hidden = !stepped;
				$("step").value = settings.step ?? 5;
				$("step-note").textContent = dial
					? "How far each notch of the dial moves the level. Pressing or touching it mutes."
					: "How far a press moves the level; below zero lowers it.";
			}

			// One mix or device, or two to switch between.
			function showSwitch({ mixes, outputs }) {
				const toggle = settings.mode === "toggle";
				$("switch").value = toggle ? "toggle" : "select";
				$("second-row").hidden = !toggle;
				const monitor = action === "monitor";
				const what = monitor ? "mix" : "device";
				$("first-label").textContent = toggle ? `First ${what}` : what[0].toUpperCase() + what.slice(1);
				$("second-label").textContent = `Second ${what}`;
				const options = monitor
					? mixes.map((mix) => [String(mix.id), mix.name])
					: outputs.map((output) => [output.name, output.description]);
				fill($("first"), options, monitor ? settings.mix : settings.device, settings.label);
				fill($("second"), options, monitor ? settings.mix2 : settings.device2);
			}

			$("channel").onchange = () => {
				const value = $("channel").value;
				if (!value) return;
				const [kind, id, ...user] = value.split(":");
				settings.channel = Number(id);
				if (kind === "v") settings.user = user.join(":");
				else delete settings.user;
				delete settings.mix;
				settings.label = $("channel").selectedOptions[0].text;
				save();
				show();
			};
			$("in").onchange = () => {
				if ($("in").value) settings.mix = Number($("in").value);
				else delete settings.mix;
				save();
			};
			$("mix").onchange = () => {
				if (!$("mix").value) return;
				settings.mix = Number($("mix").value);
				settings.label = $("mix").selectedOptions[0].text;
				save();
			};
			$("slot").onchange = () => {
				settings.slot = Number($("slot").value) || 1;
				settings.label = `Person ${settings.slot}`;
				save();
			};
			$("effect-channel").onchange = () => {
				if (!$("effect-channel").value) return;
				settings.channel = Number($("effect-channel").value);
				delete settings.effect;
				delete settings.index;
				save();
				show();
			};
			$("effect").onchange = () => {
				if ($("effect").value === "") return;
				settings.index = Number($("effect").value);
				settings.effect = $("effect").selectedOptions[0].text;
				settings.label = settings.effect;
				save();
			};
			$("app").onchange = () => {
				if (!$("app").value) return;
				settings.app = $("app").value;
				settings.label = $("app").selectedOptions[0].text;
				save();
			};
			$("app-channel").onchange = () => {
				if (!$("app-channel").value) return;
				settings.channel = Number($("app-channel").value);
				save();
			};
			$("display").onchange = () => {
				settings.display = $("display").value;
				save();
			};
			$("mode").onchange = () => {
				settings.mode = $("mode").value;
				save();
				show();
			};
			$("volume").oninput = () => ($("volume-shown").textContent = `${$("volume").value}%`);
			$("volume").onchange = () => {
				settings.volume = Number($("volume").value);
				save();
			};
			$("fade").onchange = () => {
				settings.fade = Number($("fade").value);
				save();
			};
			$("step").onchange = () => {
				settings.step = Number($("step").value) || 0;
				save();
			};
			$("switch").onchange = () => {
				settings.mode = $("switch").value;
				save();
				show();
			};
			$("first").onchange = () => {
				if (!$("first").value) return;
				if (action === "monitor") settings.mix = Number($("first").value);
				else settings.device = $("first").value;
				settings.label = $("first").selectedOptions[0].text;
				save();
			};
			$("second").onchange = () => {
				if (!$("second").value) return;
				if (action === "monitor") settings.mix2 = Number($("second").value);
				else settings.device2 = $("second").value;
				save();
			};
		</script>
	</body>
</html>
