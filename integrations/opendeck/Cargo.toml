[package]
name = "pipedeck-opendeck"
description = "Pipedeck on a Stream Deck, as an OpenDeck plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
# The touch strip's renderer, as OpenDeck 2.14 draws it: the tests draw the
# strip with it rather than with something like it.
streamdeck-strip-render = { git = "https://github.com/FrostyCoolSlug/streamdeck-strip-render", rev = "23fa1399" }
