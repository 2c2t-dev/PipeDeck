# The analysis on 2c2t's SonarQube Server, run by .github/workflows/sonar.yml.
sonar.projectKey=2c2t-dev_PipeDeck_fbb2dc3a-0653-4f9a-964d-6cc369e3b95a
sonar.projectName=Pipedeck

sonar.sources=.
# What is built, downloaded or drawn rather than written.
sonar.exclusions=target/**,dist/**,_site/**,site/fonts/**,**/*.png,**/*.svg,**/*.woff2,Cargo.lock

# Written by the workflow before the analysis.
sonar.rust.clippyReport.reportPaths=clippy.json
sonar.rust.lcov.reportPaths=lcov.info

# The examples are checks against a live mixer, read top to bottom as a
# scenario: their length is their point, so their complexity is not held
# against them.
sonar.issue.ignore.multicriteria=examples
sonar.issue.ignore.multicriteria.examples.ruleKey=*:S3776
sonar.issue.ignore.multicriteria.examples.resourceKey=**/examples/**
