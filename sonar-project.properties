# The analysis on 2c2t's SonarQube Server, run by .github/workflows/sonar.yml.
sonar.projectKey=2c2t-dev_PipeDeck_fbb2dc3a-0653-4f9a-964d-6cc369e3b95a
sonar.projectName=Pipedeck

sonar.sources=.
# What is built, downloaded or drawn rather than written, and the tests,
# which are declared as such below.
sonar.exclusions=target/**,dist/**,_site/**,site/fonts/**,**/*.png,**/*.svg,**/*.woff2,Cargo.lock,**/tests/**

# The Python tests: counted as tests, not as code to cover. The Rust ones
# live beside the code they test, which Sonar cannot tell apart.
sonar.tests=.
sonar.test.inclusions=**/tests/**

# Written by the workflow before the analysis.
sonar.rust.clippyReport.reportPaths=clippy.json
sonar.rust.lcov.reportPaths=lcov.info
sonar.python.coverage.reportPaths=python-coverage.xml

# The Pythons the code runs on: StreamController's Flatpak and the
# website's build on GitHub's Ubuntu have 3.12, a rolling distribution
# packages the newest.
sonar.python.version=3.12, 3.13, 3.14

# Kept out of the coverage only: code that runs inside a host and has no
# unit tests to run it, still analysed for bugs and maintainability. The
# GTK application's windows and drawings, checked by rendering them; the
# StreamController plugin's actions and entry, which need StreamController;
# the Vesktop plugin's renderer side, which runs in Discord; and the
# examples, which need a display, a live PipeWire or plug-ins installed.
sonar.coverage.exclusions=\
  crates/pipedeck/src/window.rs,\
  crates/pipedeck/src/*_graph.rs,\
  crates/pipedeck/src/*_dialog.rs,\
  crates/pipedeck/src/dialogs.rs,\
  crates/pipedeck/src/effect_panel.rs,\
  crates/pipedeck/src/cell.rs,\
  crates/pipedeck/src/meter_fader.rs,\
  crates/pipedeck/src/widgets.rs,\
  crates/pipedeck/src/listen.rs,\
  crates/pipedeck/src/preferences.rs,\
  crates/pipedeck/src/main.rs,\
  integrations/streamcontroller/dev_2c2t_Pipedeck/actions.py,\
  integrations/streamcontroller/dev_2c2t_Pipedeck/main.py,\
  integrations/vencord/pipedeckVoices.vesktop/index.ts,\
  **/examples/**

# The examples are checks against a live mixer, read top to bottom as a
# scenario: their length is their point, so their complexity is not held
# against them.
sonar.issue.ignore.multicriteria=examples
sonar.issue.ignore.multicriteria.examples.ruleKey=*:S3776
sonar.issue.ignore.multicriteria.examples.resourceKey=**/examples/**
