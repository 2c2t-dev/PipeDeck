name: Site

# The site in site/, with the icon and the README's pictures, published on
# Cloudflare Pages whenever one of them changes on main. Cloudflare sends
# the headers site/_headers lists, which GitHub Pages could not.
#
# It needs two repository secrets: CLOUDFLARE_API_TOKEN, a token allowed to
# edit Cloudflare Pages, and CLOUDFLARE_ACCOUNT_ID. Without them, it says so
# and publishes nothing.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/*.png"
      - ".github/workflows/site.yml"
      - "crates/pipedeck/data/dev._2c2t.Pipedeck.svg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare's secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; the site is not published."
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - name: Gather the site
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          python3 site/build.py _site
          mkdir -p _site/assets
          cp .github/mixer-*.png .github/equaliser-*.png .github/social-preview.png _site/assets/
          cp crates/pipedeck/data/dev._2c2t.Pipedeck.svg _site/assets/icon.svg
      # The pictures as WebP, at the size they are shown and at twice that,
      # which the page offers before the full PNGs.
      - name: Draw the pictures smaller
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          sudo apt-get install -y --no-install-recommends webp
          for theme in dark light; do
            cwebp -quiet -q 82 -resize 768 0 .github/mixer-$theme.png -o _site/assets/mixer-$theme-768.webp
            cwebp -quiet -q 82 -resize 1024 0 .github/mixer-$theme.png -o _site/assets/mixer-$theme-1024.webp
            cwebp -quiet -q 82 .github/mixer-$theme.png -o _site/assets/mixer-$theme-2048.webp
            cwebp -quiet -q 82 -resize 720 0 .github/equaliser-$theme.png -o _site/assets/equaliser-$theme-720.webp
            cwebp -quiet -q 82 .github/equaliser-$theme.png -o _site/assets/equaliser-$theme-1440.webp
          done
      # The project is made on the first run, and left as it is after.
      - name: Make the Cloudflare Pages project
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 pages project create pipedeck --production-branch main || true
      - uses: cloudflare/wrangler-action@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name pipedeck --branch main
