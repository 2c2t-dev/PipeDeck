name: Flatpak

# Builds Pipedeck as a Flatpak, as Flathub would, and checks it against
# Flathub's rules. Started by hand, by a change to the manifest, or by a
# release, which gets the bundle: 2c2t's Flatpak repository, in
# 2c2t-dev/flatpak, takes it from there, and signs and serves it.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "packaging/flatpak/**"
      - ".github/workflows/flatpak.yml"

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A Flatpak builds offline: every crate Cargo.lock names is listed for
      # flatpak-builder to fetch ahead.
      - name: List the crates
        run: |
          pip install --quiet aiohttp tomlkit
          curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-sources
          path: cargo-sources.json

  flatpak:
    needs: sources
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cargo-sources
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: pipedeck.flatpak
          manifest-path: packaging/flatpak/dev._2c2t.Pipedeck.yml
          cache-key: flatpak-builder-${{ github.sha }}
          # As Flathub's builds do, so its rules about screenshots hold.
          mirror-screenshots-url: https://dl.flathub.org/media
          # The branch 2c2t's repository serves it on.
          branch: stable
          upload-artifact: false
      - name: Check against Flathub's rules
        run: |
          flatpak-builder-lint manifest packaging/flatpak/dev._2c2t.Pipedeck.yml
          flatpak-builder-lint repo repo
      # The bundle, named after the release it goes on.
      - name: Name the bundle
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          case "$GITHUB_REF" in refs/tags/*) ;; *) version=dev ;; esac
          mkdir -p bundle
          cp pipedeck.flatpak "bundle/Pipedeck-$version-x86_64.flatpak"
      - uses: actions/upload-artifact@v7
        with:
          name: release-flatpak
          path: bundle/*.flatpak
