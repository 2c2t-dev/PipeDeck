name: Site

# The site in site/, with the icon and the README's pictures, published on
# GitHub Pages whenever one of them changes on main.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/*.png"
      - ".github/workflows/pages.yml"
      - "crates/pipedeck/data/dev._2c2t.Pipedeck.svg"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Gather the site
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp .github/mixer-*.png .github/equaliser-*.png .github/social-preview.png _site/assets/
          cp crates/pipedeck/data/dev._2c2t.Pipedeck.svg _site/assets/icon.svg
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
