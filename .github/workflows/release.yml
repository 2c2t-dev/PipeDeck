name: Packages

# A tag such as v0.1.0 builds the packages and puts them on that tag's
# release; started by hand from the Actions tab, it builds them to download
# from the run, as a try.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    runs-on: ubuntu-latest
    # The first Debian with the GTK 4.18 and libadwaita 1.7 Pipedeck needs.
    container: debian:trixie
    steps:
      - name: Install the build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential clang pkg-config \
            libgtk-4-dev libadwaita-1-dev libpipewire-0.3-dev curl ca-certificates git
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: packaging/package.sh deb dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-deb
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-latest
    # The first Fedora with the GTK 4.18 and libadwaita 1.7 Pipedeck needs.
    container: fedora:42
    steps:
      - name: Install the build dependencies
        run: |
          dnf install -y gcc clang pkgconf-pkg-config gtk4-devel libadwaita-devel \
            pipewire-devel rpm-build curl git
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: packaging/package.sh rpm dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-rpm
          path: dist/*.rpm

  appimage:
    runs-on: ubuntu-latest
    # The AppImage carries GTK and libadwaita, but runs on a glibc at least
    # as new as the one it was built with: Debian 13's, 2.41.
    container: debian:trixie
    steps:
      - name: Install the build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential clang pkg-config \
            libgtk-4-dev libadwaita-1-dev libpipewire-0.3-dev curl ca-certificates git \
            file librsvg2-common libgdk-pixbuf2.0-bin
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: packaging/package.sh appimage dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-appimage
          path: dist/*.AppImage

  # The Flatpak's bundle, which 2c2t's Flatpak repository takes from the
  # release; see flatpak.yml.
  flatpak:
    uses: ./.github/workflows/flatpak.yml

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [deb, rpm, appimage, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The packages are named after Cargo.toml's version: a tag that says
      # another would put them on the wrong release.
      - name: Check the tag against Cargo.toml
        run: |
          version=${GITHUB_REF_NAME#v}
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$manifest" ]; then
            echo "::error::The tag says $version, Cargo.toml says $manifest"
            exit 1
          fi
      # The release's notes: this version's section of the changelog, which
      # GitHub's own list of what was merged follows. Its lines are joined
      # back up, since GitHub breaks a release's lines where the file does.
      - name: Take the notes from the changelog
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md | sed '/./,$!d' | awk '
            /^$/ || /^#/ { if (line != "") print line; print; line = ""; next }
            /^- / { if (line != "") print line; line = $0; next }
            { sub(/^ +/, ""); line = line == "" ? $0 : line " " $0 }
            END { if (line != "") print line }
          ' > notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body_path: notes.md
          generate_release_notes: true
