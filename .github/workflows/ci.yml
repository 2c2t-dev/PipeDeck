name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes an older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Ubuntu's GTK, libadwaita and PipeWire are older than Pipedeck needs;
    # Arch has them current.
    container: archlinux:latest
    steps:
      - name: Install the system libraries
        run: |
          # A mirror that drops a download fails the whole install: others are
          # kept behind it, which pacman turns to file by file, and the install
          # is tried again a couple of times.
          printf 'Server = %s\n' \
            'https://geo.mirror.pkgbuild.com/$repo/os/$arch' \
            'https://mirrors.kernel.org/archlinux/$repo/os/$arch' \
            'https://mirror.rackspace.com/archlinux/$repo/os/$arch' >> /etc/pacman.d/mirrorlist
          for attempt in 1 2 3; do
            pacman -Syu --noconfirm --needed \
              base-devel clang git gtk4 libadwaita libpipewire opus pkgconf rustup \
              python python-pillow python-cairosvg dbus appstream && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::Installing the packages failed; trying again"
            sleep 15
          done
          rustup default stable
          rustup component add clippy rustfmt

      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # What software centres read of Pipedeck, as they read it.
      - name: Software centre listing
        run: appstreamcli validate --no-net crates/pipedeck/data/dev._2c2t.Pipedeck.metainfo.xml

      # The StreamController plugin's connection and drawing, and the
      # website's build.
      - name: Python tests
        run: |
          python -m unittest discover -s integrations/streamcontroller/tests
          python -m unittest discover -s site/tests

      # The oldest Rust Pipedeck says it builds with, read where it says so.
      - name: Oldest supported Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --all-targets --locked

      - name: GTK state synchronization
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_CONFIG_HOME=$(mktemp -d)
          export GDK_BACKEND=broadway BROADWAY_DISPLAY=:5
          export PIPEWIRE_REMOTE=pipedeck-ui-no-server
          gtk4-broadwayd :5 > /tmp/pipedeck-broadway.log 2>&1 &
          broadway_pid=$!
          trap 'kill "$broadway_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 50); do
            [ -S "$XDG_RUNTIME_DIR/broadway6.socket" ] && break
            sleep 0.1
          done
          dbus-run-session cargo test -p pipedeck --bin pipedeck \
            window::tests::external_levels_update_visible_controls \
            -- --ignored --test-threads=1
