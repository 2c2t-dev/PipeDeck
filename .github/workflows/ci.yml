name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes an older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Ubuntu's GTK, libadwaita and PipeWire are older than Pipedeck needs;
    # Arch has them current.
    container: archlinux:latest
    steps:
      - name: Install the system libraries
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel clang git gtk4 libadwaita libpipewire pkgconf rustup \
            python python-pillow python-cairosvg dbus
          rustup default stable
          rustup component add clippy rustfmt

      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The StreamController plugin's connection and drawing, and the
      # website's build.
      - name: Python tests
        run: |
          python -m unittest discover -s integrations/streamcontroller/tests
          python -m unittest discover -s site/tests

      # The oldest Rust Pipedeck says it builds with, read where it says so.
      - name: Oldest supported Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --all-targets --locked
